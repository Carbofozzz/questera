<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Questera — Quest Platform powered by GenLayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="img/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="shortcut icon" href="img/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
</head>
<body data-page-name="main-studio">
  <header class="header">
    <div class="container header__row">
      <a href="/studio" class="logo" aria-label="Questera">
        <img src="img/logo.png" alt="Questera" />
      </a>

      <input id="nav-toggle" class="nav-toggle" type="checkbox" aria-label="Open menu" />
      <label for="nav-toggle" class="burger" aria-hidden="true">
        <span></span><span></span><span></span>
      </label>

      <nav class="nav" aria-label="Основное меню">
        <a href="/studio" class="nav__link">Home</a>
        <a href="/create-studio" class="nav__link">Create Quest</a>
        <a href="/me-studio" class="nav__link">Portfolio</a>
        <a href="/faq-studio" class="nav__link">How It Works</a>
        <a href="/" class="nav__link">Bradbury</a>
      </nav>

      <button id="connectBtn" class="btn btn--wallet">Connect Wallet</button>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <h1 class="title">Find a Quest &amp; Earn Rewards</h1>
      <p class="subtitle">Complete tasks &amp; get automatic payouts</p>

      <section id="sectionToolbar" class="toolbar lockable is-locked" aria-label="Filters">
        <div class="tabs" role="tablist" aria-label="Status">
          <button id="activeBtn" class="tab tab--active" role="tab" aria-selected="true">Active</button>
          <button id="pastBtn" class="tab" role="tab" aria-selected="false">Past</button>
        </div>

        <div class="toolbar__right">
          <label class="visually-hidden" for="sort-select">Sort</label>
          <select id="sort-select" class="select">
            <option>Reward</option>
            <option>Date</option>
          </select>
        </div>
      </section>

      <section id="sectionCards" class="cards lockable is-locked">
        
        
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__row">
      <p>© 2026 Questera. All rights reserved.</p>
      <p>Questera — quest platform with escrow payouts powered by GenLayer.</p>
    </div>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
